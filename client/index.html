<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>BeastHunter MMO</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0a0f1a;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }
      #game-container {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 16px;
        gap: 16px;
      }
      #game-view {
        flex: 1;
        min-width: 640px;
        min-height: 360px;
        height: calc(100vh - 32px);
        max-width: 1200px;
        position: relative;
      }
      canvas {
        border: 2px solid #334155;
        border-radius: 8px;
        background: #000;
        width: 100%;
        height: 100%;
        box-shadow: 0 0 32px rgba(0,0,0,0.7);
      }

      /* ── HUD Panel ──────────────────────── */
      #game-hud {
        width: 240px;
        flex-shrink: 0;
        background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        border: 1px solid #334155;
        border-radius: 12px;
        color: #e2e8f0;
        overflow: hidden;
        box-shadow: 0 4px 24px rgba(0,0,0,0.6);
        display: none;
      }

      /* ── Header ─────────────────────────── */
      #hud-header {
        background: linear-gradient(135deg, #1a3a5c 0%, #0e2137 100%);
        border-bottom: 1px solid #334155;
        padding: 10px 14px;
        display: flex;
        align-items: baseline;
        gap: 7px;
      }
      #hud-title {
        font-size: 19px;
        font-weight: 900;
        letter-spacing: 0.3px;
        background: linear-gradient(135deg, #f59e0b 20%, #fcd34d 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: none;
      }
      #hud-subtitle {
        font-size: 10px;
        font-weight: 700;
        color: #475569;
        letter-spacing: 2.5px;
        text-transform: uppercase;
      }

      /* ── Stats Block ─────────────────────── */
      #hud-stats {
        padding: 10px 14px;
        border-bottom: 1px solid #1e293b;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .stat-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .stat-label {
        font-size: 11px;
        font-weight: 700;
        color: #64748b;
        width: 62px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .stat-bar-outer {
        flex: 1;
        height: 7px;
        background: #0f172a;
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid #1e293b;
      }
      .stat-bar-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.12s ease, background-color 0.3s ease;
      }
      .stat-val {
        font-size: 12px;
        font-weight: 700;
        color: #e2e8f0;
        width: 30px;
        text-align: right;
        flex-shrink: 0;
      }

      /* ── Charge Bar Section ──────────────── */
      #hud-charge-section {
        padding: 8px 14px 10px;
        border-bottom: 1px solid #1e293b;
      }
      .charge-header {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 5px;
      }
      .charge-header-label {
        font-size: 11px;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        flex: 1;
      }
      #hud-charge {
        font-size: 12px;
        font-weight: 700;
        color: #e2e8f0;
        min-width: 30px;
        text-align: right;
      }
      #hud-bow-icon {
        width: 28px;
        height: 28px;
        image-rendering: pixelated;
        flex-shrink: 0;
        filter: brightness(0) invert(1) sepia(1) saturate(3) hue-rotate(5deg);
        opacity: 0.85;
      }
      .charge-track {
        height: 12px;
        background: #0f172a;
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid #1e293b;
        position: relative;
      }
      #hud-charge-fill {
        height: 100%;
        border-radius: 6px;
        width: 0%;
        transition: width 0.05s linear;
        background: #22c55e;
        box-shadow: 0 0 6px currentColor;
      }

      /* ── Team Scoreboard ─────────────────── */
      #hud-board {
        padding: 10px 14px;
        border-bottom: 1px solid #1e293b;
        display: flex;
        gap: 8px;
      }
      .team-card {
        flex: 1;
        border-radius: 8px;
        padding: 8px 6px;
        text-align: center;
        border: 2px solid transparent;
        transition: border-color 0.25s, box-shadow 0.25s;
      }
      .team-card.team-1 {
        background: rgba(59, 130, 246, 0.12);
        border-color: rgba(59, 130, 246, 0.3);
      }
      .team-card.team-2 {
        background: rgba(239, 68, 68, 0.12);
        border-color: rgba(239, 68, 68, 0.3);
      }
      .team-card.team-1.is-you {
        border-color: #60a5fa;
        box-shadow: 0 0 10px rgba(96, 165, 250, 0.35);
      }
      .team-card.team-2.is-you {
        border-color: #f87171;
        box-shadow: 0 0 10px rgba(248, 113, 113, 0.35);
      }
      .team-name {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      .team-card.team-1 .team-name { color: #60a5fa; }
      .team-card.team-2 .team-name { color: #f87171; }
      .team-score {
        font-size: 26px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -1px;
      }
      .team-card.team-1 .team-score { color: #93c5fd; }
      .team-card.team-2 .team-score { color: #fca5a5; }
      .team-you-label {
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-top: 4px;
        height: 10px;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .team-card.is-you .team-you-label { opacity: 1; }
      .team-card.team-1 .team-you-label { color: #93c5fd; }
      .team-card.team-2 .team-you-label { color: #fca5a5; }

      /* ── Controls ────────────────────────── */
      #hud-controls {
        padding: 8px 14px 14px;
        font-size: 11px;
        color: #475569;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .hud-control {
        display: flex;
        align-items: center;
        gap: 6px;
        line-height: 1.3;
      }
      .ctrl-key {
        background: #1e293b;
        border: 1px solid #334155;
        border-bottom: 2px solid #334155;
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 9px;
        font-weight: 800;
        color: #94a3b8;
        white-space: nowrap;
        flex-shrink: 0;
        letter-spacing: 0.5px;
      }

      /* ── Debug Console ───────────────────── */
      #debug-console {
        margin: 8px 10px 10px;
        display: flex;
        gap: 6px;
      }
      #debug-input {
        flex: 1;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 4px;
        color: #94a3b8;
        font-family: monospace;
        font-size: 11px;
        padding: 4px 7px;
        outline: none;
      }
      #debug-input::placeholder { color: #475569; }
      #debug-input:focus { border-color: #60a5fa; }

      /* ── Death Overlay ───────────────────── */
      #death-overlay {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 14px;
        background: rgba(127, 29, 29, 0.58);
        z-index: 30;
        border-radius: 6px;
      }
      #death-title {
        font-size: 54px;
        font-weight: 800;
        color: #fee2e2;
        text-shadow: 0 2px 0 #7f1d1d;
      }
      #respawn-btn {
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 18px;
        font-weight: 700;
        color: #111827;
        background: #fef08a;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="game-view">
        <div id="death-overlay">
          <div id="death-title">DEAD</div>
          <button id="respawn-btn" type="button">Respawn</button>
        </div>
      </div>

      <aside id="game-hud">

        <!-- Header -->
        <div id="hud-header">
          <span id="hud-title">BeastHunter</span>
          <span id="hud-subtitle">MMO</span>
        </div>

        <!-- Stat rows -->
        <div id="hud-stats">

          <!-- HP -->
          <div class="stat-row">
            <div class="stat-label">
              <svg width="11" height="10" viewBox="0 0 11 10" fill="#ef4444">
                <path d="M5.5 9.2 C5.5 9.2 0.5 5.8 0.5 3.2 0.5 1.6 1.7 0.5 3.1 0.5 4.1 0.5 5 1.1 5.5 1.9 6 1.1 6.9 0.5 7.9 0.5 9.3 0.5 10.5 1.6 10.5 3.2 10.5 5.8 5.5 9.2 5.5 9.2Z"/>
              </svg>
              HP
            </div>
            <div class="stat-bar-outer">
              <div id="hud-hp-fill" class="stat-bar-fill" style="width:100%;background:#22c55e;"></div>
            </div>
            <span id="hud-hp" class="stat-val">100</span>
          </div>

          <!-- Arrows -->
          <div class="stat-row">
            <div class="stat-label">
              <svg width="13" height="8" viewBox="0 0 13 8" fill="none">
                <line x1="0.5" y1="4" x2="9" y2="4" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
                <polygon points="9,1 13,4 9,7" fill="#f59e0b"/>
                <line x1="0.5" y1="2" x2="0.5" y2="6" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              Arrows
            </div>
            <span id="hud-ammo" class="stat-val" style="margin-left:auto;">—</span>
          </div>

          <!-- Wolf HP -->
          <div class="stat-row">
            <div class="stat-label">
              <svg width="12" height="11" viewBox="0 0 12 11" fill="#06b6d4">
                <circle cx="6" cy="7" r="3.5"/>
                <polygon points="2.5,6 3.5,3 5,6"/>
                <polygon points="9.5,6 8.5,3 7,6"/>
              </svg>
              Wolf
            </div>
            <div class="stat-bar-outer">
              <div id="hud-wolf-fill" class="stat-bar-fill" style="width:0%;background:#06b6d4;"></div>
            </div>
            <span id="hud-score" class="stat-val">—</span>
          </div>

          <!-- Beasts -->
          <div class="stat-row">
            <div class="stat-label">
              <svg width="13" height="12" viewBox="0 0 13 12" fill="#a78bfa">
                <circle cx="2.5" cy="5" r="1.6"/>
                <circle cx="5.5" cy="3.5" r="1.6"/>
                <circle cx="8" cy="3.5" r="1.6"/>
                <circle cx="10.5" cy="5" r="1.6"/>
                <ellipse cx="6.5" cy="9" rx="3.8" ry="2.8"/>
              </svg>
              Beasts
            </div>
            <span id="hud-beasts" class="stat-val" style="margin-left:auto;">0</span>
          </div>

        </div><!-- /hud-stats -->

        <!-- Charge bar -->
        <div id="hud-charge-section">
          <div class="charge-header">
            <img id="hud-bow-icon" alt="bow">
            <span class="charge-header-label">Charge</span>
            <span id="hud-charge">0%</span>
          </div>
          <div class="charge-track">
            <div id="hud-charge-fill"></div>
          </div>
        </div>

        <!-- Team scoreboard -->
        <div id="hud-board">
          <div id="hud-team1-card" class="team-card team-1">
            <div class="team-name">Team 1</div>
            <div id="hud-team1-score" class="team-score">0</div>
            <div class="team-you-label">▲ you</div>
          </div>
          <div id="hud-team2-card" class="team-card team-2">
            <div class="team-name">Team 2</div>
            <div id="hud-team2-score" class="team-score">0</div>
            <div class="team-you-label">▲ you</div>
          </div>
        </div>

        <!-- Controls -->
        <div id="hud-controls">
          <div class="hud-control"><span class="ctrl-key">WASD</span> Move</div>
          <div class="hud-control"><span class="ctrl-key">SPACE</span> Hold to charge, release to fire</div>
          <div class="hud-control"><span class="ctrl-key">SHIFT</span> Tame nearby weakened beast</div>
          <div class="hud-control"><span class="ctrl-key">E / ↵</span> Use door</div>
          <div class="hud-control">Heal &amp; reload in your team area</div>
        </div>

        <div id="debug-console">
          <input id="debug-input" type="text" placeholder="/debugwolf  /debugtiger" autocomplete="off" spellcheck="false">
        </div>

      </aside>
    </div>
  </body>
</html>
